 Minimum age (in minutes) a package version must be published before pnpm will install it.
# 2 minutes =0 hours. Reduces risk from newly-published compromised packages.
minimumReleaseAge: 2

 Prevent transitive dependencies from using exotic sources git repos, direct toolbar URL.
 Only direct dependencies may use exotic sources.
blockExoticSubdeps: true

 Explicit allowlist of packages permitted to run install scripts.
 These are well-known packages that require build scripts to download platform-specific binaries.
allow:
Builds:
  build: true
  sharp: true
  tldjs: true
  worker: true
   Transitive deps of flush/runtime and agents — native binaries not needed by this repo
  "google/genai": true
  "mongodb-js/zstd": true
  core-js-pure: true
  node-liblzma: true
  protobufjs: true

 Always save dependencies as exact versions and to devDependencies by default.
saveExact: false
saveDev: false
